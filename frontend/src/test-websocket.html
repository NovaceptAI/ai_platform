<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .log {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .log-entry {
            padding: 5px;
            margin: 5px 0;
            border-left: 3px solid #ccc;
            padding-left: 10px;
        }
        .log-entry.success { border-left-color: #4CAF50; color: #4CAF50; }
        .log-entry.error { border-left-color: #f44336; color: #f44336; }
        .log-entry.info { border-left-color: #2196F3; color: #2196F3; }
        button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0b7dda;
        }
        input {
            padding: 8px;
            width: 300px;
            margin: 5px;
        }
        .status {
            font-size: 18px;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .status.connected {
            background: #4CAF50;
            color: white;
        }
        .status.disconnected {
            background: #f44336;
            color: white;
        }
    </style>
</head>
<body>
    <h1>WebSocket Connection Test - Collaborate Namespace</h1>

    <div>
        <label>Backend URL:</label>
        <input type="text" id="backendUrl" value="https://scoolish.com" placeholder="https://scoolish.com">
    </div>

    <div>
        <label>Access Token (from localStorage):</label>
        <input type="text" id="accessToken" placeholder="Paste your access token here">
        <button onclick="loadTokenFromStorage()">Load from localStorage</button>
    </div>

    <div>
        <button onclick="testConnection()">Test Connection</button>
        <button onclick="disconnectSocket()">Disconnect</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <div id="status" class="status disconnected">Status: Disconnected</div>

    <div class="log" id="log">
        <div class="log-entry info">Waiting for connection test...</div>
    </div>

    <script>
        let socket = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[${type}] ${message}`);
        }

        function updateStatus(connected) {
            const statusDiv = document.getElementById('status');
            if (connected) {
                statusDiv.className = 'status connected';
                statusDiv.textContent = 'Status: Connected ✓';
            } else {
                statusDiv.className = 'status disconnected';
                statusDiv.textContent = 'Status: Disconnected ✗';
            }
        }

        function loadTokenFromStorage() {
            try {
                // Try to get token from localStorage
                const token = localStorage.getItem('access_token');
                if (token) {
                    document.getElementById('accessToken').value = token;
                    log('Token loaded from localStorage', 'success');
                } else {
                    log('No token found in localStorage', 'error');
                }
            } catch (e) {
                log(`Error loading token: ${e.message}`, 'error');
            }
        }

        function testConnection() {
            const backendUrl = document.getElementById('backendUrl').value;
            const token = document.getElementById('accessToken').value;

            if (!token) {
                log('Please provide an access token', 'error');
                return;
            }

            log(`Attempting to connect to: ${backendUrl}/collaborate`, 'info');
            log(`Token: ${token.substring(0, 20)}...`, 'info');

            // Disconnect existing socket if any
            if (socket) {
                socket.disconnect();
                socket = null;
            }

            try {
                // Create socket connection with /collaborate namespace
                socket = io(`${backendUrl}/collaborate`, {
                    path: '/socket.io',
                    query: { token: token },
                    transports: ['websocket', 'polling'],
                    reconnection: true,
                    reconnectionDelay: 1000,
                    reconnectionDelayMax: 5000,
                    reconnectionAttempts: 5
                });

                // Connection events
                socket.on('connect', () => {
                    log('✓ WebSocket connected successfully!', 'success');
                    log(`Socket ID: ${socket.id}`, 'info');
                    updateStatus(true);
                });

                socket.on('disconnect', (reason) => {
                    log(`✗ WebSocket disconnected: ${reason}`, 'error');
                    updateStatus(false);
                });

                socket.on('connect_error', (error) => {
                    log(`✗ Connection error: ${error.message}`, 'error');
                    log(`Error details: ${JSON.stringify(error)}`, 'error');
                    updateStatus(false);
                });

                socket.on('connection_established', (data) => {
                    log(`✓ Connection established event received`, 'success');
                    log(`User data: ${JSON.stringify(data)}`, 'info');
                });

                socket.on('error', (error) => {
                    log(`✗ Socket error: ${JSON.stringify(error)}`, 'error');
                });

                // Test emitting an event after connection
                setTimeout(() => {
                    if (socket && socket.connected) {
                        log('Testing event emission...', 'info');
                        socket.emit('test_event', { message: 'Hello from test page' });
                    }
                }, 2000);

            } catch (e) {
                log(`Exception during connection: ${e.message}`, 'error');
                updateStatus(false);
            }
        }

        function disconnectSocket() {
            if (socket) {
                socket.disconnect();
                socket = null;
                log('Disconnected manually', 'info');
                updateStatus(false);
            } else {
                log('No active socket connection', 'info');
            }
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '<div class="log-entry info">Log cleared...</div>';
        }

        // Auto-load token on page load
        window.onload = () => {
            loadTokenFromStorage();
        };
    </script>
</body>
</html>
